{% extends "main/base.html" %}

{% block content %}

<div class="container my-5">
    <h2 class="text-center fw-bold mb-5">O‘qituvchilar</h2>

    <div class="row g-4">
        {% for o in oqituvchilar %}
        <div class="col-md-4">
            <div class="card shadow-sm h-100 text-center p-3">
                <img src="{{ o.image.url }}" class="rounded-circle mx-auto"
                     style="width:150px;height:150px;object-fit:cover;">
                <h5 class="mt-3">{{ o.full_name }}</h5>
                <p class="text-muted">{{ o.subject }}</p>
                {% if o.phone %}<p>📞 {{ o.phone }}</p>{% endif %}
                {% if o.email %}<p>✉️ {{ o.email }}</p>{% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
