{% extends 'main/base.html' %}
{% load static %}

{% block content %}

<div class="container mt-5">

    <h2>        Ushbu yo‘nalishda dasturlash asoslari, web texnologiyalar,
        ma’lumotlar bazasi, kompyuter tizimlari va zamonaviy IT
        texnologiyalari o‘rgatiladi:</h2>
    <hr class="my-4">

    <div class="row">

        <div class="col-md-6">
            <div class="img-wrapper mb-4">
                <img src="{% static 'main/images/dastur1.jpg' %}" class="gallery-img">
            </div>
            <div class="img-wrapper">
                <img src="{% static 'main/images/dastur2.jpg' %}" class="gallery-img">
            </div>
        </div>

        <div class="col-md-6">
            <div class="img-wrapper mb-4">
                <img src="{% static 'main/images/dastur3.jpg' %}" class="gallery-img">
            </div>
            <div class="img-wrapper">
                <img src="{% static 'main/images/dastur4.jpg' %}" class="gallery-img">
            </div>
        </div>

    </div>

</div>

<style>
.gallery-img{
    width:100%;
    height:250px;
    object-fit:cover;
    transition:0.4s;
}

.img-wrapper{
    overflow:hidden;
    border-radius:12px;
}

.img-wrapper:hover .gallery-img{
    transform:scale(1.1);
}
</style>

{% endblock %}
