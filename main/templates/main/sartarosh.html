{% extends 'main/base.html' %}
{% load static %}

{% block content %}

<!-- Katta banner -->

<div class="container mt-5">

    <h2>        Ushbu yo‘nalishda soch turmaklash, zamonaviy soch kesish usullari,
        bo‘yash texnologiyalari hamda mijozlar bilan ishlash madaniyati o‘rgatiladi:</h2>

    <hr class="my-4">

    <div class="row">

        <div class="col-md-6">
            <div class="img-wrapper mb-4">
                <img src="{% static 'main/images/sartarosh1.jpg' %}" class="gallery-img">
            </div>
            <div class="img-wrapper">
                <img src="{% static 'main/images/sartarosh2.jpg' %}" class="gallery-img">
            </div>
        </div>

        <div class="col-md-6">
            <div class="img-wrapper mb-4">
                <img src="{% static 'main/images/sartarosh3.jpg' %}" class="gallery-img">
            </div>
            <div class="img-wrapper">
                <img src="{% static 'main/images/sartarosh4.jpg' %}" class="gallery-img">
            </div>
        </div>

    </div>

</div>

<style>
.gallery-img{
    width:100%;
    height:250px;
    object-fit:cover;
    transition:0.4s;
}

.img-wrapper{
    overflow:hidden;
    border-radius:12px;
}

.img-wrapper:hover .gallery-img{
    transform:scale(1.1);
}
</style>

{% endblock %}
